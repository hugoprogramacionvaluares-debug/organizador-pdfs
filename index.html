<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de Expedientes AI (Dark Mode)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF-lib para fusionar y dividir PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <!-- JSZip para empaquetar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- PDF.js para leer texto de los PDFs (Extracción de medidas) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</head>
<body class="bg-black text-gray-300 font-sans min-h-screen p-6">
    <div class="max-w-[1400px] mx-auto">
        
        <!-- Encabezado -->
        <header class="bg-gray-900 shadow-lg rounded-2xl p-6 mb-6 border border-gray-800 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-blue-500"></i> Generador de Expediente AI
                </h1>
                <p class="text-gray-400 text-sm mt-1">Organiza, extrae medidas y utiliza Gemini AI para clasificar documentos escaneados.</p>
            </div>
            <div class="flex flex-wrap gap-3">
                <label class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl cursor-pointer font-bold text-sm transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-upload"></i> 1. Subir PDFs
                    <input type="file" id="fileInput" multiple accept=".pdf" class="hidden" onchange="handleFiles(this.files)">
                </label>
                <button onclick="generarArchivosSeparados()" id="btnGenerar" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-file-zipper"></i> 2. Descargar Expediente
                </button>
            </div>
        </header>

        <!-- Módulo IA y Herramientas Especiales -->
        <div class="bg-gray-900 p-5 rounded-2xl shadow-lg border border-gray-800 mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Inteligencia Artificial -->
            <div class="border border-gray-700 p-4 rounded-xl bg-black">
                <h3 class="text-white font-semibold mb-2 flex items-center gap-2"><i class="fa-solid fa-robot text-purple-500"></i> Clasificación Inteligente (Gemini Vision)</h3>
                <p class="text-xs text-gray-400 mb-3">La IA leerá visualmente los documentos escaneados que no se acomoden por nombre.</p>
                <div class="flex gap-2">
                    <input type="password" id="geminiApiKey" placeholder="Pega tu API Key de Gemini aquí..." class="w-full text-xs p-2 border border-gray-700 rounded-lg bg-gray-900 text-white focus:border-purple-500 outline-none">
                    <button onclick="clasificarSinClasificarConIA()" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition shrink-0">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Auto-Clasificar IA
                    </button>
                </div>
            </div>

            <!-- Extracción de Escrituras -->
            <div class="border border-gray-700 p-4 rounded-xl bg-black flex flex-col justify-between">
                <div>
                    <h3 class="text-white font-semibold mb-2 flex items-center gap-2"><i class="fa-solid fa-scissors text-pink-500"></i> Extraer Medidas y Colindancias</h3>
                    <p class="text-xs text-gray-400 mb-3">Busca dentro del texto de
